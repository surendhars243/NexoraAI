<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register | Nexora AI</title>
  <meta name="description" content="Create your free Nexora AI student account and start earning XP for what you learn." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="nx-auth-wrap">
    <div class="nx-card nx-auth-card">
      <div class="text-center mb-4">
        <a class="nx-logo" href="index.html">
          <span class="nx-logo-mark"><i class="fa-solid fa-brain"></i></span>
          Nexora <span class="text-nexora">AI</span>
        </a>
        <h5 class="fw-bold mt-3 mb-1">Create your account</h5>
        <p class="text-muted small mb-0">Start learning and earning XP today.</p>
      </div>

      <div id="authAlert" class="d-none"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="regName" class="form-label small fw-semibold">Full Name</label>
          <input type="text" class="form-control" id="regName" placeholder="Aditi Sharma" required />
        </div>
        <div class="mb-3">
          <label for="regEmail" class="form-label small fw-semibold">Email</label>
          <input type="email" class="form-control" id="regEmail" placeholder="student@college.edu" required />
        </div>
        <div class="mb-3">
          <label for="regPassword" class="form-label small fw-semibold">Password</label>
          <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required />
        </div>
        <div class="mb-3">
          <label for="regConfirm" class="form-label small fw-semibold">Confirm Password</label>
          <input type="password" class="form-control" id="regConfirm" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-nexora w-100">Register</button>
      </form>

      <p class="text-center small text-muted mt-3 mb-0">
        Already have an account? <a href="login.html" class="text-nexora text-decoration-none fw-semibold">Login</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
