<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Nexora AI</title>
  <meta name="description" content="Log in to your Nexora AI student account to continue your personalized learning path." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="nx-auth-wrap">
    <div class="nx-card nx-auth-card">
      <div class="text-center mb-4">
        <a class="nx-logo" href="index.html">
          <span class="nx-logo-mark"><i class="fa-solid fa-brain"></i></span>
          Nexora <span class="text-nexora">AI</span>
        </a>
        <h5 class="fw-bold mt-3 mb-1">Welcome back 👋</h5>
        <p class="text-muted small mb-0">Log in to continue learning.</p>
      </div>

      <div id="authAlert" class="d-none"></div>

      <!-- Login form (demo only, no backend) -->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="loginEmail" class="form-label small fw-semibold">Email</label>
          <div class="input-group">
            <span class="input-group-text bg-white rounded-start-3"><i class="fa-solid fa-envelope text-muted"></i></span>
            <input type="email" class="form-control" id="loginEmail" placeholder="student@college.edu" />
          </div>
        </div>
        <div class="mb-2">
          <label for="loginPassword" class="form-label small fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white rounded-start-3"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" />
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" checked />
            <label class="form-check-label small" for="remember">Remember me</label>
          </div>
          <a href="#" class="small text-nexora text-decoration-none" data-bs-toggle="modal" data-bs-target="#forgotModal">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-nexora w-100 mb-2">Login</button>
        <a href="register.html" class="btn btn-nexora-outline w-100">Register</a>
      </form>

      <p class="text-center small text-muted mt-3 mb-0">
        <a href="index.html" class="text-decoration-none text-muted"><i class="fa-solid fa-arrow-left me-1"></i>Back to home</a>
      </p>
    </div>
  </div>

  <!-- Forgot password modal -->
  <div class="modal fade" id="forgotModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header border-0">
          <h6 class="modal-title fw-bold">Reset your password</h6>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-0">
          <p class="small text-muted">Enter your registered email and we'll send a reset link.</p>
          <input type="email" class="form-control rounded-3" placeholder="student@college.edu" />
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-nexora-outline" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-nexora" data-bs-dismiss="modal">Send Link</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
