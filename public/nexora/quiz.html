<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz | Nexora AI</title>
  <meta name="description" content="Attempt the Python Basics quiz with a live timer and instant score." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link href="dashboard.css" rel="stylesheet" />
</head>
<body data-page="quiz" data-title="Quiz">
  <aside class="nx-sidebar" id="sidebar"></aside>
  <div class="nx-main">
    <header class="nx-topbar" id="topbar"></header>
    <main class="nx-content">
      <div class="mx-auto" style="max-width:720px">
        <div class="nx-card p-4" id="quizCard">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge bg-primary-subtle text-primary rounded-pill" id="qCounter">Question 1 of 5</span>
            <span class="badge bg-danger-subtle text-danger rounded-pill">
              <i class="fa-regular fa-clock me-1"></i><span id="timer">05:00</span>
            </span>
          </div>
          <div class="progress rounded-pill mb-4" style="height:6px">
            <div class="progress-bar" id="qProgress" style="width:0%;background:var(--nx-primary)"></div>
          </div>

          <div id="quizBox"></div>

          <div class="d-flex justify-content-end gap-2 mt-3">
            <button class="btn btn-nexora" id="nextBtn">Next <i class="fa-solid fa-arrow-right ms-1"></i></button>
            <button class="btn btn-nexora d-none" id="submitBtn">Submit Quiz</button>
          </div>
        </div>

        <!-- Score shown after submitting -->
        <div class="nx-card d-none" id="resultCard"></div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
