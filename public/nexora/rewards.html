<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rewards | Nexora AI</title>
  <meta name="description" content="Redeem your Nexora AI reward points for vouchers, coupons and certificates." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link href="dashboard.css" rel="stylesheet" />
</head>
<body data-page="rewards" data-title="Rewards">
  <aside class="nx-sidebar" id="sidebar"></aside>
  <div class="nx-main">
    <header class="nx-topbar" id="topbar"></header>
    <main class="nx-content">
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="nx-card p-4 d-flex align-items-center gap-3">
            <div class="nx-stat-icon yellow"><i class="fa-solid fa-star"></i></div>
            <div><div class="text-muted small">Current XP</div><div class="fs-3 fw-bold">2,450</div></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="nx-card p-4 d-flex align-items-center gap-3">
            <div class="nx-stat-icon green"><i class="fa-solid fa-gift"></i></div>
            <div><div class="text-muted small">Reward Points</div><div class="fs-3 fw-bold">780</div></div>
          </div>
        </div>
      </div>

      <h6 class="fw-bold mb-3">Available Rewards</h6>
      <div class="row g-3 mb-4" id="rewardGrid"></div>

      <h6 class="fw-bold mb-3">Reward History</h6>
      <div class="nx-card p-3">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-light"><tr><th>Date</th><th>Item</th><th>Points</th><th>Status</th></tr></thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Redeem confirmation modal -->
  <div class="modal fade" id="redeemModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 text-center p-3">
        <div class="modal-body">
          <div class="nx-stat-icon green mx-auto mb-3"><i class="fa-solid fa-check"></i></div>
          <h6 class="fw-bold">Redeem request placed!</h6>
          <p class="small text-muted mb-0">Your reward will be delivered to your registered email within 24 hours.</p>
        </div>
        <div class="modal-footer border-0 justify-content-center">
          <button class="btn btn-nexora" data-bs-dismiss="modal">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
