<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile | Nexora AI</title>
  <meta name="description" content="Your Nexora AI student profile: skills, achievements and certificates." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link href="dashboard.css" rel="stylesheet" />
</head>
<body data-page="profile" data-title="Profile">
  <aside class="nx-sidebar" id="sidebar"></aside>
  <div class="nx-main">
    <header class="nx-topbar" id="topbar"></header>
    <main class="nx-content">
      <div class="row g-3">
        <!-- Profile card -->
        <div class="col-lg-4">
          <div class="nx-card p-4 text-center h-100">
            <i class="fa-solid fa-circle-user text-nexora" style="font-size:6rem"></i>
            <h5 class="fw-bold mt-3 mb-0">Aditi Sharma</h5>
            <p class="text-muted small mb-1">Information Technology · 2nd Year</p>
            <p class="text-muted small">Sinhgad Institute of Technology</p>
            <button class="btn btn-nexora w-100" data-bs-toggle="modal" data-bs-target="#editModal">
              <i class="fa-solid fa-pen me-2"></i>Edit Profile
            </button>
          </div>
        </div>

        <div class="col-lg-8">
          <!-- Skills -->
          <div class="nx-card p-4 mb-3">
            <h6 class="fw-bold mb-3">Skills</h6>
            <span class="badge rounded-pill bg-primary-subtle text-primary me-2 mb-2 px-3 py-2">Python</span>
            <span class="badge rounded-pill bg-primary-subtle text-primary me-2 mb-2 px-3 py-2">HTML &amp; CSS</span>
            <span class="badge rounded-pill bg-primary-subtle text-primary me-2 mb-2 px-3 py-2">JavaScript</span>
            <span class="badge rounded-pill bg-primary-subtle text-primary me-2 mb-2 px-3 py-2">DBMS</span>
            <span class="badge rounded-pill bg-primary-subtle text-primary me-2 mb-2 px-3 py-2">Git</span>
          </div>

          <!-- Achievements -->
          <div class="nx-card p-4 mb-3">
            <h6 class="fw-bold mb-3">Achievements</h6>
            <div class="row g-2">
              <div class="col-md-4"><div class="nx-card p-3 text-center"><div class="nx-stat-icon green mx-auto mb-2"><i class="fa-solid fa-seedling"></i></div><small class="fw-semibold">Beginner Badge</small></div></div>
              <div class="col-md-4"><div class="nx-card p-3 text-center"><div class="nx-stat-icon red mx-auto mb-2"><i class="fa-solid fa-fire"></i></div><small class="fw-semibold">10-Day Streak</small></div></div>
              <div class="col-md-4"><div class="nx-card p-3 text-center"><div class="nx-stat-icon yellow mx-auto mb-2"><i class="fa-solid fa-medal"></i></div><small class="fw-semibold">Quiz Master</small></div></div>
            </div>
          </div>

          <!-- Certificates -->
          <div class="nx-card p-4">
            <h6 class="fw-bold mb-3">Certificates</h6>
            <ul class="list-group list-group-flush">
              <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                <span><i class="fa-solid fa-certificate text-nexora me-2"></i>HTML &amp; CSS Fundamentals</span>
                <a href="#" class="btn btn-nexora-outline btn-sm">Download</a>
              </li>
              <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                <span><i class="fa-solid fa-certificate text-nexora me-2"></i>Python Basics</span>
                <a href="#" class="btn btn-nexora-outline btn-sm">Download</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit profile modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header border-0"><h6 class="fw-bold mb-0">Edit Profile</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body pt-0">
          <label class="form-label small fw-semibold">Name</label>
          <input class="form-control rounded-3 mb-3" value="Aditi Sharma" />
          <label class="form-label small fw-semibold">Department</label>
          <input class="form-control rounded-3 mb-3" value="Information Technology" />
          <label class="form-label small fw-semibold">College</label>
          <input class="form-control rounded-3" value="Sinhgad Institute of Technology" />
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-nexora-outline" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-nexora" data-bs-dismiss="modal">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
