<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Dashboard | Nexora AI</title>
  <meta name="description" content="Track courses, XP, streaks, tasks and weekly progress on your Nexora AI student dashboard." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link href="dashboard.css" rel="stylesheet" />
</head>
<body data-page="dashboard" data-title="Dashboard">

  <aside class="nx-sidebar" id="sidebar"></aside>

  <div class="nx-main">
    <header class="nx-topbar" id="topbar"></header>

    <main class="nx-content">
      <!-- Welcome banner -->
      <section class="nx-welcome mb-4">
        <div class="row align-items-center g-3">
          <div class="col-lg-8">
            <h4 class="fw-bold mb-1">Welcome back 👋</h4>
            <p class="mb-3 opacity-75">Current course: <strong>Python Programming</strong> · 62% complete</p>
            <div class="progress rounded-pill" style="height:10px;max-width:460px">
              <div class="progress-bar" style="width:62%"></div>
            </div>
          </div>
          <div class="col-lg-4 text-lg-end">
            <a href="learning-path.html" class="btn btn-light fw-semibold rounded-3 px-4">
              <i class="fa-solid fa-play me-2"></i>Continue Learning
            </a>
          </div>
        </div>
      </section>

      <!-- Statistics cards -->
      <section class="row g-3 mb-4" id="statCards"></section>

      <div class="row g-3 mb-4">
        <!-- Continue learning -->
        <div class="col-lg-8">
          <h6 class="fw-bold mb-3">Continue Learning</h6>
          <div class="row g-3" id="continueCards"></div>
        </div>
        <!-- Today's tasks -->
        <div class="col-lg-4">
          <h6 class="fw-bold mb-3">Today's Tasks</h6>
          <div class="nx-card p-3" id="taskList"></div>
        </div>
      </div>

      <div class="row g-3">
        <!-- Weekly progress chart -->
        <div class="col-lg-8">
          <div class="nx-card p-3 h-100">
            <h6 class="fw-bold mb-3">Weekly Progress</h6>
            <div style="height:280px"><canvas id="weeklyChart"></canvas></div>
          </div>
        </div>
        <!-- Achievements -->
        <div class="col-lg-4">
          <div class="nx-card p-3 h-100">
            <h6 class="fw-bold mb-3">Achievements</h6>
            <div class="row g-2" id="achievementList"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
