<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Courses | Nexora AI</title>
  <meta name="description" content="All your enrolled Nexora AI courses with difficulty level and progress." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link href="dashboard.css" rel="stylesheet" />
</head>
<body data-page="courses" data-title="My Courses">
  <aside class="nx-sidebar" id="sidebar"></aside>
  <div class="nx-main">
    <header class="nx-topbar" id="topbar"></header>
    <main class="nx-content">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h5 class="fw-bold mb-0">Enrolled Courses</h5>
        <div class="btn-group">
          <button class="btn btn-nexora-outline btn-sm active">All</button>
          <button class="btn btn-nexora-outline btn-sm">In Progress</button>
          <button class="btn btn-nexora-outline btn-sm">Completed</button>
        </div>
      </div>

      <div class="row g-3" id="courseGrid"></div>

      <!-- Pagination -->
      <nav class="mt-4">
        <ul class="pagination justify-content-center">
          <li class="page-item disabled"><a class="page-link rounded-start-3" href="#">Previous</a></li>
          <li class="page-item active"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link rounded-end-3" href="#">Next</a></li>
        </ul>
      </nav>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
