<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Study Buddy | Nexora AI</title>
  <meta name="description" content="Chat with the Nexora AI Study Buddy to explain concepts, generate notes and build quizzes." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link href="dashboard.css" rel="stylesheet" />
</head>
<body data-page="buddy" data-title="AI Study Buddy">
  <aside class="nx-sidebar" id="sidebar"></aside>
  <div class="nx-main">
    <header class="nx-topbar" id="topbar"></header>
    <main class="nx-content">
      <div class="mx-auto" style="max-width:860px">
        <div class="nx-card p-3">
          <div class="d-flex align-items-center gap-2 mb-3">
            <div class="nx-stat-icon blue"><i class="fa-solid fa-robot"></i></div>
            <div>
              <h6 class="fw-bold mb-0">AI Study Buddy</h6>
              <small class="text-success"><i class="fa-solid fa-circle" style="font-size:.5rem"></i> Online · demo mode</small>
            </div>
          </div>

          <div class="nx-chat-area" id="chatArea"></div>

          <!-- Suggested prompts -->
          <div class="d-flex flex-wrap gap-2 my-3">
            <button class="btn btn-nexora-outline btn-sm" data-prompt="Explain Variables">Explain Variables</button>
            <button class="btn btn-nexora-outline btn-sm" data-prompt="Generate Notes">Generate Notes</button>
            <button class="btn btn-nexora-outline btn-sm" data-prompt="Create Quiz">Create Quiz</button>
            <button class="btn btn-nexora-outline btn-sm" data-prompt="Summarize Topic">Summarize Topic</button>
          </div>

          <form class="input-group" id="chatForm">
            <input class="form-control rounded-start-3" id="chatInput" placeholder="Ask anything about your course..." />
            <button class="btn btn-nexora rounded-end-3" type="submit"><i class="fa-solid fa-paper-plane"></i> Send</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
