<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings | Nexora AI</title>
  <meta name="description" content="Manage your Nexora AI password, notifications and theme preferences." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link href="dashboard.css" rel="stylesheet" />
</head>
<body data-page="settings" data-title="Settings">
  <aside class="nx-sidebar" id="sidebar"></aside>
  <div class="nx-main">
    <header class="nx-topbar" id="topbar"></header>
    <main class="nx-content">
      <div class="mx-auto" style="max-width:720px">

        <!-- Change password -->
        <div class="nx-card p-4 mb-3">
          <h6 class="fw-bold mb-3">Change Password</h6>
          <input type="password" class="form-control rounded-3 mb-2" placeholder="Current password" />
          <input type="password" class="form-control rounded-3 mb-2" placeholder="New password" />
          <input type="password" class="form-control rounded-3 mb-3" placeholder="Confirm new password" />
          <button class="btn btn-nexora">Update Password</button>
        </div>

        <!-- Notifications -->
        <div class="nx-card p-4 mb-3">
          <h6 class="fw-bold mb-3">Notification Settings</h6>
          <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="n1" checked /><label class="form-check-label small" for="n1">Daily learning reminder</label></div>
          <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="n2" checked /><label class="form-check-label small" for="n2">Quiz and deadline alerts</label></div>
          <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="n3" /><label class="form-check-label small" for="n3">Weekly progress email</label></div>
        </div>

        <!-- Theme + logout -->
        <div class="nx-card p-4">
          <h6 class="fw-bold mb-3">Appearance</h6>
          <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" id="themeToggle" />
            <label class="form-check-label small" for="themeToggle">Enable dark theme (demo)</label>
          </div>
          <a href="login.html" class="btn btn-outline-danger rounded-3">
            <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
          </a>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
