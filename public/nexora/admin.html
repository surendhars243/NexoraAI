<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard | Nexora AI</title>
  <meta name="description" content="Nexora AI admin panel: students, courses, rewards issued and overall progress analytics." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link href="dashboard.css" rel="stylesheet" />
</head>
<body data-page="admin" data-title="Admin Dashboard">
  <aside class="nx-sidebar" id="sidebar"></aside>
  <div class="nx-main">
    <header class="nx-topbar" id="topbar"></header>
    <main class="nx-content">

      <div class="row g-3 mb-4" id="adminStats"></div>

      <div class="nx-card p-3 mb-4">
        <h6 class="fw-bold mb-3">Student Progress Overview</h6>
        <div style="height:300px"><canvas id="adminChart"></canvas></div>
      </div>

      <!-- Students table -->
      <div class="nx-card p-3 mb-3">
        <h6 class="fw-bold mb-3">Students</h6>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-light"><tr><th>ID</th><th>Name</th><th>Course</th><th>Progress</th><th>XP</th></tr></thead>
            <tbody id="adminStudents"></tbody>
          </table>
        </div>
      </div>

      <!-- Courses table -->
      <div class="nx-card p-3 mb-3">
        <h6 class="fw-bold mb-3">Courses</h6>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-light"><tr><th>Code</th><th>Course</th><th>Students</th><th>Level</th></tr></thead>
            <tbody id="adminCourses"></tbody>
          </table>
        </div>
      </div>

      <!-- Rewards table -->
      <div class="nx-card p-3">
        <h6 class="fw-bold mb-3">Rewards</h6>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-light"><tr><th>ID</th><th>Student</th><th>Reward</th><th>Status</th></tr></thead>
            <tbody id="adminRewards"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
